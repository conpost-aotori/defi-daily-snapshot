name: daily-snapshot

# Posts a DeFi daily-snapshot card to Discord and X 2× per day.
# JST 08:05 / 20:05 — 12 hours apart, hitting the morning open and the
# late-evening US-market wrap windows. Cron is :05 to dodge the GH Actions
# top-of-hour rush (the schedule trigger is best-effort and can drift
# 5–15 min under load).
on:
  schedule:
    - cron: '5 23 * * *'  # 08:05 JST  (23:05 UTC, prev day)
    - cron: '5 11 * * *'  # 20:05 JST  (11:05 UTC, same day)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip Discord/X posts (preview only)'
        type: boolean
        default: false
      no_x:
        description: 'Skip X (Twitter) post only'
        type: boolean
        default: false
      no_discord:
        description: 'Skip Discord post only'
        type: boolean
        default: false

# Share `bot-state` branch with the other workflows in this repo (hourly,
# build-watchlist, refresh-pnl) — serialize so they don't clobber each other's
# DB push.
concurrency:
  group: bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # Noto Sans CJK is needed for Japanese glyph rendering in the snapshot
      # PNG. Pre-installed on ubuntu-latest? Not reliably — install it.
      - name: Install Japanese font (Noto Sans CJK, from upstream release)
        # apt's fonts-noto-cjk (61 MB) sometimes crawls from the Ubuntu mirror
        # (6+ min at ~160 kB/s) and the job hits timeout-minutes before it can
        # post. Fetch the same .ttc files from the pinned upstream release into
        # the same path apt uses (file paths / family names unchanged).
        timeout-minutes: 4
        run: |
          set -euo pipefail
          d=/usr/share/fonts/opentype/noto
          sudo mkdir -p "$d"
          base=https://github.com/notofonts/noto-cjk/raw/Sans2.004/Sans/OTC
          for f in NotoSansCJK-Regular.ttc NotoSansCJK-Bold.ttc; do
            sudo curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 120 -o "$d/$f" "$base/$f"
          done
          ls -l "$d"
          sudo fc-cache -f >/dev/null
          fc-list : family | grep -F "Noto Sans CJK JP" >/dev/null \
            || { echo "::error::Noto Sans CJK JP not registered"; exit 1; }

      - name: Install
        run: pip install -e .

      - name: Restore state DB from bot-state branch
        run: bash scripts/_ci_state.sh restore

      - name: Build flag args
        id: flags
        run: |
          ARGS=""
          if [[ "${{ inputs.no_x }}" == "true" ]]; then ARGS="$ARGS --no-x"; fi
          if [[ "${{ inputs.no_discord }}" == "true" ]]; then ARGS="$ARGS --no-discord"; fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then ARGS="$ARGS --dry-run"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run daily snapshot
        env:
          DAILY_SNAPSHOT_DISCORD_WEBHOOK_URL: ${{ secrets.DAILY_SNAPSHOT_DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          LOG_LEVEL: INFO
          POLYMARKET_USER_AGENT: defi-daily-snapshot/0.1 (+https://github.com/${{ github.repository }})
        run: python scripts/run_daily.py ${{ steps.flags.outputs.args }}

      - name: Persist state DB
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/_ci_state.sh save
